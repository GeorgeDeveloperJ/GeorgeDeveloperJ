name: Refresh profile activity

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/update_activity.py
      - .github/workflows/activity.yml
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-activity

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refresh README
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_activity.py "$PROFILE_USER" "$GITHUB_REPOSITORY"
      - name: Publish activity changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Refresh profile activity'
          git push origin "HEAD:$GITHUB_REF"
